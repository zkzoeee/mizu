[package]
name = "pipeline-cuda"
version = "0.1.0"
edition = "2021"
autobins = false

[workspace]
# Resolver 1, deliberately, for the same reason tools/pasta-proof is:
# resolver 2 does not apply a feature enabled on a normal dependency to the
# same crate in the host/build graph, and `sp1-gpu-sys` build-depends on
# `sp1-core-executor`, so the runner's build script loses the `profiling`
# feature it asserts on and the CUDA build dies with "Vesta proof spike
# requires the portable runner". That assert fires only on x86_64 Linux, so a
# Mac build never sees it -- wazabi's r123 hit it, this repository hit it on
# 2026-11-10, and the CPU pod hit it again on 2026-11-12.
#
# Do NOT satisfy the assert with CARGO_FEATURE_PROFILING: that silences the
# guard while leaving the unpatched native executor linked.
#
# This is why the CUDA driver cannot live in the root workspace, which is
# resolver 2. The CPU driver (crates/pipeline-runner) can and does.
resolver = "1"

[dependencies]
anyhow = "1"
bincode = "=1.3.3"
# For build_vks' `Either<Vec<usize>, usize>` index selector, as in
# crates/pipeline-runner. Already in the SP1 tree's graph.
either = "1"
clap = { version = "4.0", features = ["derive"] }
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

sp1-core-executor = { version = "=6.10.0", features = ["profiling"] }
sp1-core-executor-runner = { version = "=6.10.0", features = ["profiling"] }
sp1-core-machine = "=6.10.0"
sp1-hypercube = "=6.10.0"
sp1-primitives = "=6.10.0"
sp1-prover = { version = "=6.10.0", features = ["experimental"] }
sp1-prover-types = "=6.10.0"

# The full-pipeline CUDA components: core, recursion, shrink and wrap.
# tools/pasta-proof deliberately avoids this crate because it pulls sp1-prover
# and with it the recursion and gnark stack, which a core proof never touches.
# Compress and wrap do touch them, so here it is the right dependency.
sp1-gpu-prover = "=6.10.0"
sp1-gpu-cudart = "=6.10.0"

[features]
# --mode groth16 only. Routes the gnark FFI through its native backend, which
# compiles the Go library in sp1-recursion-gnark-ffi's build.rs, so a Go
# toolchain at or above the go.mod directive (1.24.0) and libclang for bindgen
# are required on the builder; build-essential does not provide libclang.
# Without this feature the FFI uses its Docker backend, and a container with no
# Docker fails at wrap time rather than at build time.
#
# Also needs SP1_CIRCUIT_MODE=dev at runtime: that is what makes
# try_build_groth16_artifacts_dir (build.rs:102) build the wrap keys locally
# instead of installing released artifacts. Note that the local Groth16 setup is
# gnark's own unsafe one -- fine for measurement, never for production. The
# production route is to match upstream's wrap vk and install Succinct's
# released keys; see docs/groth16-ceremony-spike.md.
native-gnark = ["sp1-prover/native-gnark"]

# Every SP1/slop crate is pinned to the fork, not because the fork modified
# them all -- it modifies four -- but to force ONE resolution. sp1-prover
# patched to a path resolves its `workspace = true` deps from the fork's
# workspace, while the crates.io sp1-gpu-* crates would take sp1-hypercube
# from the registry. Two sp1-hypercubes in one graph is a type error.
[patch.crates-io]
ark-ec = { path = "../../vendor/algebra/ec" }
ark-ff = { path = "../../vendor/algebra/ff" }
ark-poly = { path = "../../vendor/algebra/poly" }
ark-serialize = { path = "../../vendor/algebra/serialize" }
slop-air = { path = "../../vendor/sp1/slop/crates/air" }
slop-algebra = { path = "../../vendor/sp1/slop/crates/algebra" }
slop-alloc = { path = "../../vendor/sp1/slop/crates/alloc" }
slop-baby-bear = { path = "../../vendor/sp1/slop/crates/baby-bear" }
slop-basefold = { path = "../../vendor/sp1/slop/crates/basefold" }
slop-basefold-prover = { path = "../../vendor/sp1/slop/crates/basefold-prover" }
slop-bn254 = { path = "../../vendor/sp1/slop/crates/bn254" }
slop-challenger = { path = "../../vendor/sp1/slop/crates/challenger" }
slop-commit = { path = "../../vendor/sp1/slop/crates/commit" }
slop-dft = { path = "../../vendor/sp1/slop/crates/dft" }
slop-fri = { path = "../../vendor/sp1/slop/crates/fri" }
slop-futures = { path = "../../vendor/sp1/slop/crates/futures" }
slop-jagged = { path = "../../vendor/sp1/slop/crates/jagged" }
slop-keccak-air = { path = "../../vendor/sp1/slop/crates/keccak-air" }
slop-koala-bear = { path = "../../vendor/sp1/slop/crates/koala-bear" }
slop-matrix = { path = "../../vendor/sp1/slop/crates/matrix" }
slop-maybe-rayon = { path = "../../vendor/sp1/slop/crates/maybe-rayon" }
slop-merkle-tree = { path = "../../vendor/sp1/slop/crates/merkle-tree" }
slop-multilinear = { path = "../../vendor/sp1/slop/crates/multilinear" }
slop-poseidon2 = { path = "../../vendor/sp1/slop/crates/poseidon2" }
slop-primitives = { path = "../../vendor/sp1/slop/crates/primitives" }
slop-stacked = { path = "../../vendor/sp1/slop/crates/stacked" }
slop-sumcheck = { path = "../../vendor/sp1/slop/crates/sumcheck" }
slop-symmetric = { path = "../../vendor/sp1/slop/crates/symmetric" }
slop-tensor = { path = "../../vendor/sp1/slop/crates/tensor" }
slop-uni-stark = { path = "../../vendor/sp1/slop/crates/uni-stark" }
slop-utils = { path = "../../vendor/sp1/slop/crates/utils" }
slop-whir = { path = "../../vendor/sp1/slop/crates/whir" }
sp1-core-executor = { path = "../../vendor/sp1/crates/core/executor" }
sp1-core-executor-runner = { path = "../../vendor/sp1/crates/core/runner" }
sp1-core-machine = { path = "../../vendor/sp1/crates/core/machine" }
sp1-curves = { path = "../../vendor/sp1/crates/curves" }
sp1-derive = { path = "../../vendor/sp1/crates/derive" }
sp1-hypercube = { path = "../../vendor/sp1/crates/hypercube" }
sp1-jit = { path = "../../vendor/sp1/crates/core/jit" }
sp1-primitives = { path = "../../vendor/sp1/crates/primitives" }
sp1-prover = { path = "../../vendor/sp1/crates/prover" }
sp1-prover-types = { path = "../../vendor/sp1/crates/prover-types" }
sp1-recursion-circuit = { path = "../../vendor/sp1/crates/recursion/circuit" }
sp1-recursion-compiler = { path = "../../vendor/sp1/crates/recursion/compiler" }
sp1-recursion-executor = { path = "../../vendor/sp1/crates/recursion/executor" }
sp1-recursion-gnark-ffi = { path = "../../vendor/sp1/crates/recursion/gnark-ffi" }
sp1-recursion-machine = { path = "../../vendor/sp1/crates/recursion/machine" }
sp1-verifier = { path = "../../vendor/sp1/crates/verifier" }

[profile.release]
opt-level = 3
debug = 0
strip = "debuginfo"
codegen-units = 1
lto = false

[[bin]]
name = "pipeline-cuda"
path = "src/main.rs"
