[package]
name = "pasta-precompile-proof"
version = "0.1.0"
edition = "2021"
autobins = false

[workspace]

[dependencies]
anyhow = "1"
libc = "0.2"
bincode = "=1.3.3"
hex = "0.4"
num = "0.4.3"
serde_json = "1"
sha2 = "0.10"
strum = { version = "=0.27.2", features = ["derive"] }
slop-algebra = "=6.10.0"
slop-air = "=6.10.0"
slop-alloc = "=6.10.0"
slop-basefold = "=6.10.0"
slop-challenger = "=6.10.0"
slop-matrix = "=6.10.0"
slop-multilinear = "=6.10.0"
sp1-core-executor = { version = "=6.10.0", features = ["profiling"] }
sp1-core-executor-runner = { version = "=6.10.0", features = ["profiling"] }
sp1-core-machine = "=6.10.0"
sp1-curves = "=6.10.0"
sp1-derive = "=6.10.0"
sp1-hypercube = "=6.10.0"
sp1-primitives = "=6.10.0"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CUDA proving. Optional, and off by default: these never build on the
# development Mac. Only the GPU crates actually used are listed; depending on
# `sp1-gpu-prover` instead would pull in `sp1-prover` and with it the recursion
# and gnark stack, which a core proof never touches.
slop-futures = { version = "=6.10.0", optional = true }
sp1-gpu-air = { version = "=6.10.0", optional = true }
sp1-gpu-basefold = { version = "=6.10.0", optional = true }
sp1-gpu-challenger = { version = "=6.10.0", optional = true }
sp1-gpu-cudart = { version = "=6.10.0", optional = true }
sp1-gpu-logup-gkr = { version = "=6.10.0", optional = true }
sp1-gpu-merkle-tree = { version = "=6.10.0", optional = true }
sp1-gpu-shard-prover = { version = "=6.10.0", optional = true }

[features]
default = []
mprotect = ["sp1-core-machine/mprotect", "sp1-core-executor/mprotect", "sp1-core-executor-runner/mprotect", "sp1-hypercube/mprotect"]
# Opt-in: route modular inversion in witness generation through GMP's extended
# Euclid instead of num-bigint's Fermat exponentiation. Measured on both Pasta
# moduli over 20,000 samples: 32.6 us -> 1.2 us per inversion, a 26x cut, and
# the generic Weierstrass addition needs one per call across 2,002,975 calls in
# the r5 workload.
#
# Off by default for two reasons. It pulls in `rug`, which builds GMP from
# source, adding a C toolchain dependency to every build including CI and the
# remote pod. And the win is largely absorbed in the current GPU pipeline,
# where the executor is co-critical with the whole prove stage — see
# spikes/artifacts/r12-inversion/findings.json. The inverse-reuse half of that
# work needs no feature and is always on.
gmp = ["sp1-core-machine/bigint-rug"]
cuda = [
    "dep:slop-futures",
    "dep:sp1-gpu-air",
    "dep:sp1-gpu-basefold",
    "dep:sp1-gpu-challenger",
    "dep:sp1-gpu-cudart",
    "dep:sp1-gpu-logup-gkr",
    "dep:sp1-gpu-merkle-tree",
    "dep:sp1-gpu-shard-prover",
]

# Only the four Pasta fork crates are patched here. The root workspace and the
# retained r6 `sp1-vesta-proof` fork are left untouched.
[patch.crates-io]
sp1-core-executor = { path = "../../vendor/sp1/crates/core/executor" }
sp1-core-executor-runner = { path = "../../vendor/sp1/crates/core/runner" }
sp1-core-machine = { path = "../../vendor/sp1/crates/core/machine" }
sp1-curves = { path = "../../vendor/sp1/crates/curves" }

[profile.release]
opt-level = 3
debug = 0
strip = "debuginfo"
codegen-units = 1
lto = false

[[bin]]
name = "pasta-precompile-proof-6-10"
path = "src/main.rs"

[[bin]]
name = "pasta-trace-accounting-6-10"
path = "src/bin/trace-accounting.rs"
