[package]
name = "settlement-program"
version = "0.1.0"
edition = "2021"

[dependencies]
sp1-zkvm = "=6.10.0"
pickles-verifier = { path = "../../../crates/pickles-verifier", default-features = false }
mizu-settlement-types = { path = "../types" }
ark-ff = { version = "0.5.0", features = ["std"] }
mina-poseidon = { path = "../../../vendor/proof-systems/poseidon" }
alloy-primitives = { version = "=0.8.20", features = ["sha3-keccak"] }

[target.'cfg(target_os = "zkvm")'.dependencies]
sp1-lib = "=6.10.0"

[build-dependencies]
mina-curves = { path = "../../../vendor/proof-systems/curves" }
pickles-verifier = { path = "../../../crates/pickles-verifier" }
poly-commitment = { path = "../../../vendor/proof-systems/poly-commitment" }
sha2 = "0.10"

[[bin]]
name = "settlement-program"
path = "src/main.rs"
test = false
bench = false
