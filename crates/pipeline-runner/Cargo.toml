[package]
name = "pipeline-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
# The fork's prover, reached through the root [patch.crates-io] closure.
# `experimental` is what gates without_vk_verification() (builder.rs:293).
sp1-prover = { version = "=6.10.0", default-features = false, features = ["experimental"] }
sp1-prover-types = { version = "=6.10.0" }
sp1-core-executor = { version = "=6.10.0" }
# The fork's runner build.rs asserts `profiling` on x86_64 Linux
# (vendor/sp1/crates/core/runner/build.rs:10), and sp1-prover reaches it
# transitively without the feature. Declared here so the pod build matches
# cycle-runner's selection.
sp1-core-executor-runner = { version = "=6.10.0", features = ["profiling"] }
sp1-core-machine = { version = "=6.10.0" }
sp1-hypercube = { version = "=6.10.0" }
sp1-primitives = { version = "=6.10.0" }
anyhow = { workspace = true }
clap = { version = "4.0", features = ["derive"] }
serde_json = { workspace = true }
hex = { workspace = true }
bincode = { workspace = true }
sha2 = "0.10"
# For build_vks' `Either<Vec<usize>, usize>` index selector. Already in the root
# lock at 1.15.0 via the SP1 tree, so this adds an edge, not a resolution.
either = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
# --mode groth16 only. Routes the gnark FFI through its native
# backend, which compiles the Go library in sp1-recursion-gnark-ffi's build.rs,
# so a Go toolchain (>= the go.mod directive, 1.24.0) and libclang for bindgen
# are required on the builder. Without it the FFI uses its Docker backend and
# fails at wrap time rather than at build time.
#
# Also needs SP1_CIRCUIT_MODE=dev at runtime, which is what makes
# try_build_groth16_artifacts_dir fall back to building the wrap keys locally
# instead of installing released artifacts from S3. That local setup is gnark's
# own unsafe one: measurement only, never production.
native-gnark = ["sp1-prover/native-gnark"]

[[bin]]
name = "pipeline-runner"
path = "src/main.rs"

# Guard for the recursion VK map depth; see docs/groth16-ceremony-spike.md.
[[bin]]
name = "vk-map-guard"
path = "src/bin/vk-map-guard.rs"

# Per-cluster compress-shape needs, and whether they reach the wrap input.
[[bin]]
name = "compress-shape-audit"
path = "src/bin/compress-shape-audit.rs"

# Builds the partial VK map locally, from records rather than a core proof.
[[bin]]
name = "vk-map-local"
path = "src/bin/vk-map-local.rs"
